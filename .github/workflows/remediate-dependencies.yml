name: Temporary dependency remediation

on:
  push:
    branches: [fix/security-and-reliability]

permissions:
  contents: write

jobs:
  remediate:
    if: contains(github.event.head_commit.message, 'try dependency remediation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-and-reliability
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply available npm security fixes (including major updates)
        working-directory: backend
        run: npm audit fix --force
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run regression tests
        working-directory: backend
        run: npm test
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Require no high or critical audit findings
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Commit dependency updates only after successful checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): remediate high and critical npm advisories [skip ci]"
            git push origin fix/security-and-reliability
          fi
